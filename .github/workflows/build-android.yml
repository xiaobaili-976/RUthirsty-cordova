name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'zhizhi_music/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        working-directory: zhizhi_music
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: zhizhi_music
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: zhizhi-music-debug-${{ github.run_number }}
          path: zhizhi_music/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "app-v1.0.${{ github.run_number }}"
          name: "知知音乐 v1.0.${{ github.run_number }}"
          body: |
            ## 知知音乐 v1.0.${{ github.run_number }}

            ### 功能
            - 尤克里里练习：和弦识别、指法辅助
            - 演唱练习：录音 + AI 音高检测（CREPE 模型）
            - 乐理知识库
            - 曲库管理与练习进度跟踪

            ### 系统要求
            Android 9.0 (API 28) 及以上
          files: zhizhi_music/app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: true
