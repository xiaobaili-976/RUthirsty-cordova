name: Build TOEIC Speaking Pro EXE

on:
  push:
    branches: [main]
    paths:
      - 'toeic_simulator/**'
      - '.github/workflows/build-toeic.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: toeic_simulator/requirements.txt

      - name: Install dependencies
        working-directory: toeic_simulator
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller
        working-directory: toeic_simulator
        shell: pwsh
        run: pyinstaller toeic_pro.spec --clean --noconfirm

      - name: Generate question_bank.xlsx from JSON (if needed)
        working-directory: toeic_simulator
        shell: pwsh
        run: |
          if (-not (Test-Path question_bank.xlsx)) {
            python make_question_bank_xlsx.py
          }

      - name: Package release folder
        working-directory: toeic_simulator
        shell: pwsh
        run: |
          $v = "v1.0.${{ github.run_number }}"

          New-Item -ItemType Directory -Path release\images  -Force | Out-Null
          New-Item -ItemType Directory -Path release\records -Force | Out-Null
          New-Item -ItemType Directory -Path release\model   -Force | Out-Null

          Copy-Item dist\TOEIC_Speaking_Pro.exe release\

          if (Test-Path app_icon.ico) {
            Copy-Item app_icon.ico release\
          }

          if (Test-Path question_bank.xlsx) {
            Copy-Item question_bank.xlsx release\
          } elseif (Test-Path question_bank.json) {
            Copy-Item question_bank.json release\
          }

          if (Test-Path images) {
            Copy-Item images release\images -Recurse -Force
          }

          Copy-Item DIST_README.txt release\README.txt

          Compress-Archive -Path release\* -DestinationPath TOEIC_Speaking_Pro_Windows_$v.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TOEIC_Speaking_Pro_Windows_v1.0.${{ github.run_number }}
          path: toeic_simulator/TOEIC_Speaking_Pro_Windows_v1.0.${{ github.run_number }}.zip
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "TOEIC Speaking Pro v1.0.${{ github.run_number }}"
          body: |
            ## TOEIC Speaking Pro v1.0.${{ github.run_number }} — Windows EXE

            ### 功能亮点
            - 完整 TOEIC Speaking 考试流程（Part 1-5，计时 / 跳过 / 录音）
            - 参考答案弹窗（书籍图标）+ 离线朗读答案（TTS）
            - 专项训练模式（顶部标签页横向切换，无页面跳转）：
              · 随机练习 / 答案速背 / 高频专练 / 薄弱巩固 / 单项集训（Part 1–5 独立练习）
            - 标记高频 / 薄弱题并本地存储
            - 🔊 语音评分引擎四选一（右上角齿轮菜单热切换，无需重启）：
              · 讯飞 ISE / 腾讯云智聆 / 驰声 Chivox / 本地开源 (Whisper+SpeechScore)
              · 选择即生效，引擎配置本地保存，下次自动记忆
            - 3 天试用期 + 邀请码激活
            - 开发者模式下齿轮菜单保留（仅显示评分引擎 + 退出）

            ### 界面 & 体验优化
            - 🎧 作答音频一键回放（考试栏 + 结束页）
            - 🎤 首页话筒试音图标按钮（四态反馈）
            - 🎵 专项训练按钮集成极简声波图标，风格统一
            - 📊 考试结束简易成绩报告（用时 / 各 PART 录音完成率 / 薄弱项）
            - 🖼 极简商务风应用图标（声波 + TOEIC，256×256 ICO 多档嵌入）

            ### 下载使用
            下载 zip，解压后双击 `TOEIC_Speaking_Pro.exe`，详见 README.txt。

            ### 系统要求
            Windows 10 / 11（64 位），无需安装 Python
          files: toeic_simulator/TOEIC_Speaking_Pro_Windows_v1.0.${{ github.run_number }}.zip
          draft: false
          prerelease: false
