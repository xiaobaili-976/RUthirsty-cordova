name: Build TOEIC Simulator EXE

on:
  push:
    branches: [main]
    paths:
      - 'toeic_simulator/**'
      - '.github/workflows/build-toeic.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        working-directory: toeic_simulator
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 pyttsx3 pyaudio vosk openpyxl pyinstaller

      - name: Build with PyInstaller
        working-directory: toeic_simulator
        shell: pwsh
        run: |
          pyinstaller `
            --onefile `
            --windowed `
            --name "TOEIC_Speaking_Simulator" `
            --hidden-import "pyttsx3.drivers" `
            --hidden-import "pyttsx3.drivers.sapi5" `
            --hidden-import "pyttsx3.drivers.nsss" `
            --hidden-import "pyttsx3.drivers.espeak" `
            --hidden-import "vosk" `
            --collect-all PyQt6 `
            main.py

      - name: Generate question_bank.xlsx from JSON
        working-directory: toeic_simulator
        shell: pwsh
        run: python make_question_bank_xlsx.py

      - name: Package release folder
        working-directory: toeic_simulator
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release\images\set1 -Force | Out-Null
          New-Item -ItemType Directory -Path release\images\set2 -Force | Out-Null
          New-Item -ItemType Directory -Path release\records      -Force | Out-Null
          New-Item -ItemType Directory -Path release\model        -Force | Out-Null

          Copy-Item dist\TOEIC_Speaking_Simulator.exe release\
          Copy-Item question_bank.xlsx               release\
          if (Test-Path images) { Copy-Item images release\images -Recurse -Force }

          $v = "v1.0.${{ github.run_number }}"
          $readme = @"
          TOEIC Speaking Test Simulator $v
          =====================================================

          [使用方法]
          1. 用 Excel 编辑 question_bank.xlsx 填写题目与参考答案。
             Sheet 结构：Sets | Part1 | Part2 | Part3 | Part4 | Part5
          2. Part 2 图片放入 images\set1\、images\set2\ 等子文件夹，
             路径须与 xlsx 中一致。
          3. 双击 TOEIC_Speaking_Simulator.exe 启动程序。
          4. 首次启动进入 3 天试用期，标题栏实时倒计时。
          5. 试用到期后程序提示联系开发者获取授权。

          [开发者模式]
          - 方法一：按 Ctrl+Shift+T 输入开发口令，跳过试用限制。
          - 方法二：将 dev_mode.txt 文件放在 EXE 同目录，重启生效。

          [录音 / 语音转文字（可选）]
          - 连接麦克风后，作答阶段自动录音（标题栏显示 ● REC）。
          - 录音保存至 records\set_{id}\ 目录。
          - 启用语音转文字：
              a. 前往 https://alphacephei.com/vosk/models
              b. 下载 vosk-model-small-en-us（约 40 MB）
              c. 解压后重命名为 model，放在 EXE 同目录

          [系统要求]
          Windows 10 / 11 64 位，无需安装 Python。
          "@
          Set-Content -Path release\README.txt -Value $readme -Encoding utf8

          Compress-Archive -Path release\* `
            -DestinationPath TOEIC_Simulator_Windows_$v.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TOEIC_Simulator_Windows_v1.0.${{ github.run_number }}
          path: toeic_simulator/TOEIC_Simulator_Windows_v1.0.${{ github.run_number }}.zip
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "TOEIC Speaking Simulator v1.0.${{ github.run_number }}"
          body: |
            ## 托业口语考试模拟器 v1.0.${{ github.run_number }} — Windows EXE

            ### 功能概览
            - 完整 TOEIC Speaking 考试流程（Part 1–5，含计时、跳过、录音）
            - 参考答案弹窗（📖 按钮）
            - 3 天全功能试用期，标题栏实时倒计时
            - 开发者模式：Ctrl+Shift+T 输入口令，或放置 `dev_mode.txt` 跳过限制
            - 题库支持 Excel（question_bank.xlsx）/ JSON / CSV 三种格式
            - 可选语音录音 + Vosk 语音转文字

            ### 下载使用
            下载 `TOEIC_Simulator_Windows_v1.0.${{ github.run_number }}.zip`，解压后参见 README.txt

            ### 系统要求
            Windows 10 / 11（64 位），无需安装 Python
          files: toeic_simulator/TOEIC_Simulator_Windows_v1.0.${{ github.run_number }}.zip
          draft: false
          prerelease: false
